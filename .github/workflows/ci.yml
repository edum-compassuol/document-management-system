name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build do frontend e testes do backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configura o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instala as dependências do backend
        working-directory: backend
        run: npm install

      - name: Instala as dependências do frontend
        working-directory: frontend
        run: npm install

      - name: Builda o frontend
        working-directory: frontend
        run: npm run build

      - name: Roda os testes do backend
        working-directory: backend
        run: npm test
